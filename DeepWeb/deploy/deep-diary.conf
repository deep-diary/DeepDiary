# SSL 加密文件路径
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.key
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.pem
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.key
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.pem

# HTTP 重定向到 HTTPS - deep-diary.com
server {
        listen 80;
        server_name deep-diary.com www.deep-diary.com;
        return 301 https://$server_name$request_uri;
}

# HTTPS - deep-diary.com 和 www.deep-diary.com
server {
        listen 443 ssl http2;
        server_name deep-diary.com www.deep-diary.com;
        
        # SSL 证书配置
        ssl_certificate /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.pem;
        ssl_certificate_key /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.key;
        
        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # 安全头（移除 includeSubDomains，避免影响 stream.deep-diary.com 子域名）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # 启用 gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml font/woff2 font/woff font/ttf;
        gzip_disable "msie6";
        
        # 使用 sub_filter 替换 Google Fonts URL 为代理路径
        # 注意：需要 nginx 编译时包含 --with-http_sub_module
        
        # favicon.ico 文件（精确匹配，优先级最高）
        location = /favicon.ico {
                root /var/www/deep-diary;
                add_header Content-Type image/x-icon;
                add_header Cache-Control "public, max-age=86400" always;
                access_log off;  # 减少日志
        }
        
        # manifest.json 文件（精确匹配）
        location = /manifest.json {
                root /var/www/deep-diary;
                add_header Content-Type application/json;
                add_header Cache-Control "public, max-age=86400" always;
        }
        
        # 静态资源优化（Gradio 的静态文件，排除已精确匹配的文件）
        location ~* \.(woff2|woff|ttf|eot|svg|css|js|png|jpg|jpeg|gif)$ {
                proxy_pass http://localhost:7860;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 静态资源缓存头
                add_header Cache-Control "public, max-age=86400" always;
                expires 1d;
        }
        
        # Google Fonts 代理端点
        location /_proxy/fonts.googleapis.com/ {
                # 移除前缀
                rewrite ^/_proxy/fonts.googleapis.com/(.*) /$1 break;
                
                proxy_pass https://fonts.googleapis.com;
                proxy_set_header Host fonts.googleapis.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 缓存
                proxy_cache_valid 200 7d;
                add_header Cache-Control "public, max-age=604800" always;
        }
        
        # Google Fonts 字体文件代理
        location /_proxy/fonts.gstatic.com/ {
                # 移除前缀
                rewrite ^/_proxy/fonts.gstatic.com/(.*) /$1 break;
                
                proxy_pass https://fonts.gstatic.com;
                proxy_set_header Host fonts.gstatic.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 缓存
                proxy_cache_valid 200 30d;
                add_header Cache-Control "public, max-age=2592000" always;
        }
        
        # MediaMTX 视频流代理（通过 HTTPS 代理，解决混合内容问题）
        # 精确匹配 hls.min.js 文件（优先级最高）
        location = /stream/hls.min.js {
                alias /var/www/deep-diary/stream/hls.min.js;
                add_header Content-Type application/javascript;
                add_header Cache-Control "public, max-age=604800" always;
        }
        
        # 处理子路径下的 hls.min.js（使用 ^~ 前缀匹配，阻止正则匹配）
        location ^~ /stream/ {
                # 检查是否是子路径下的 hls.min.js，如果是则重定向到根路径
                if ($request_uri ~ ^/stream/[^/]+/hls\.min\.js$) {
                        return 301 /stream/hls.min.js;
                }
                
                # 其他请求继续处理
                rewrite ^/stream/(.*) /$1 break;
                
                proxy_pass http://localhost:8888;
                proxy_set_header Host 35.192.64.247:8888;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                
                # 替换 HTML 中的相对路径为绝对路径（解决静态资源加载问题）
                # hls.min.js 从根目录加载
                sub_filter 'src="hls.min.js"' 'src="/stream/hls.min.js"';
                sub_filter_once off;
                sub_filter_types text/html;
                
                # WebSocket 支持
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置（视频流需要较长超时）
                proxy_connect_timeout 10s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                
                # 缓冲设置（HTML 需要缓冲以便 sub_filter 工作）
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
                
                # CORS 头
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        }
        
        # 处理其他静态资源（如 css、图片等），从 MediaMTX 根目录加载
        location ~ ^/stream/(.+\.(css|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico))$ {
                # 静态资源从 MediaMTX 根目录加载（去掉流路径前缀）
                rewrite ^/stream/[^/]+/(.+)$ /$1 break;
                rewrite ^/stream/(.+)$ /$1 break;
                
                proxy_pass http://localhost:8888;
                proxy_set_header Host 35.192.64.247:8888;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 静态资源缓存
                proxy_cache_valid 200 7d;
                add_header Cache-Control "public, max-age=604800" always;
        }
        
        
        # 主代理配置
        location / {
                proxy_pass http://localhost:7860;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 替换 Google Fonts URL 为代理路径（解决国内访问问题）
                sub_filter 'https://fonts.googleapis.com' 'https://$host/_proxy/fonts.googleapis.com';
                sub_filter 'https://fonts.gstatic.com' 'https://$host/_proxy/fonts.gstatic.com';
                sub_filter_once off;  # 替换所有匹配项
                sub_filter_types text/html text/css application/javascript application/json;
                
                # WebSocket 支持
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                # 缓冲设置
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
        }
}

# HTTP 重定向到 HTTPS - img.deep-diary.com
