# SSL 加密文件路径
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.key
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.pem
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.key
# /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.pem

# HTTP 重定向到 HTTPS - deep-diary.com
server {
        listen 80;
        server_name deep-diary.com www.deep-diary.com;
        return 301 https://$server_name$request_uri;
}

# HTTPS - deep-diary.com 和 www.deep-diary.com
server {
        listen 443 ssl http2;
        server_name deep-diary.com www.deep-diary.com;
        
        # SSL 证书配置
        ssl_certificate /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.pem;
        ssl_certificate_key /home/liyun.xu/DeepDiary/DeepWeb/deploy/www.deep-diary.com.key;
        
        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # 启用 gzip 压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/xml font/woff2 font/woff font/ttf;
        gzip_disable "msie6";
        
        # 使用 sub_filter 替换 Google Fonts URL 为代理路径
        # 注意：需要 nginx 编译时包含 --with-http_sub_module
        
        # favicon.ico 文件（精确匹配，优先级最高）
        location = /favicon.ico {
                root /var/www/deep-diary;
                add_header Content-Type image/x-icon;
                add_header Cache-Control "public, max-age=86400" always;
                access_log off;  # 减少日志
        }
        
        # manifest.json 文件（精确匹配）
        location = /manifest.json {
                root /var/www/deep-diary;
                add_header Content-Type application/json;
                add_header Cache-Control "public, max-age=86400" always;
        }
        
        # 静态资源优化（Gradio 的静态文件，排除已精确匹配的文件）
        location ~* \.(woff2|woff|ttf|eot|svg|css|js|png|jpg|jpeg|gif)$ {
                proxy_pass http://localhost:7860;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 静态资源缓存头
                add_header Cache-Control "public, max-age=86400" always;
                expires 1d;
        }
        
        # Google Fonts 代理端点
        location /_proxy/fonts.googleapis.com/ {
                # 移除前缀
                rewrite ^/_proxy/fonts.googleapis.com/(.*) /$1 break;
                
                proxy_pass https://fonts.googleapis.com;
                proxy_set_header Host fonts.googleapis.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 缓存
                proxy_cache_valid 200 7d;
                add_header Cache-Control "public, max-age=604800" always;
        }
        
        # Google Fonts 字体文件代理
        location /_proxy/fonts.gstatic.com/ {
                # 移除前缀
                rewrite ^/_proxy/fonts.gstatic.com/(.*) /$1 break;
                
                proxy_pass https://fonts.gstatic.com;
                proxy_set_header Host fonts.gstatic.com;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 缓存
                proxy_cache_valid 200 30d;
                add_header Cache-Control "public, max-age=2592000" always;
        }
        
        # MediaMTX 视频流代理（解决混合内容问题：HTTPS 页面加载 HTTP iframe）
        # 将 MediaMTX 的 HTTP 服务通过 HTTPS 代理
        location /mediamtx/ {
                # 移除 /mediamtx/ 前缀
                rewrite ^/mediamtx/(.*) /$1 break;
                
                proxy_pass http://35.192.64.247:8888;
                # 注意：Host 头设置为目标服务器，而不是代理服务器
                proxy_set_header Host 35.192.64.247:8888;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                
                # WebSocket 支持（MediaMTX 可能需要）
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置（视频流需要较长超时）
                proxy_connect_timeout 10s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                
                # 缓冲设置（视频流需要关闭缓冲以减少延迟）
                proxy_buffering off;
                
                # CORS 头（如果需要）
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        }
        
        # 主代理配置
        location / {
                proxy_pass http://localhost:7860;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                
                # 替换 Google Fonts URL 为代理路径（解决国内访问问题）
                sub_filter 'https://fonts.googleapis.com' 'https://$host/_proxy/fonts.googleapis.com';
                sub_filter 'https://fonts.gstatic.com' 'https://$host/_proxy/fonts.gstatic.com';
                sub_filter_once off;  # 替换所有匹配项
                sub_filter_types text/html text/css application/javascript application/json;
                
                # WebSocket 支持
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                # 缓冲设置
                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 4k;
        }
}

