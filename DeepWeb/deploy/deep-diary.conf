        listen 80;
        server_name img.deep-diary.com;
        return 301 https://$server_name$request_uri;
}

# HTTPS - img.deep-diary.com
server {
        listen 443 ssl http2;
        server_name img.deep-diary.com;
        
        # SSL 证书配置
        ssl_certificate /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.pem;
        ssl_certificate_key /home/liyun.xu/DeepDiary/DeepWeb/deploy/img.deep-diary.com.key;
        
        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # 安全头（移除 includeSubDomains，避免影响 stream.deep-diary.com 子域名）
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # 增加缓冲区大小以支持大文件上传
        client_max_body_size 10000M;
        
        location / {
                proxy_pass http://localhost:2283;
                proxy_http_version 1.1;
                
                # 基本代理头
                # 注意：Immich 需要 Host 头为 localhost:2283 才能正常工作
                proxy_set_header Host localhost:2283;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
                
                # WebSocket 支持（Immich 可能需要）
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
                
                # 缓冲设置
                proxy_buffering off;
        }
}

# HTTP - stream.deep-diary.com (MediaMTX 视频流服务)
# 注意：只使用 HTTP，不配置 HTTPS，避免证书问题
server {
        listen 80;
        server_name stream.deep-diary.com;
        
        # 明确禁用 HSTS（避免浏览器强制使用 HTTPS）
        add_header Strict-Transport-Security "max-age=0" always;
        
        # 直接代理到 MediaMTX 服务
        location / {
                proxy_pass http://localhost:8888;
                proxy_set_header Host 35.192.64.247:8888;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $host;
                
                # WebSocket 支持
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                
                # 超时设置（视频流需要较长超时）
                proxy_connect_timeout 10s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                
                # 缓冲设置（视频流需要关闭缓冲以减少延迟）
                proxy_buffering off;
                
                # CORS 头（允许从 HTTPS 页面嵌入）
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        }
}